{% extends "base.html" %}
{% block title %}Record payment{% endblock %}
{% block page_title %}Record payment for {{ bill.number }}{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <p class="muted">Balance due: <strong>{{ bill.currency_code }} {{ bill.balance_due_cents() | money }}</strong></p>
  <form method="post">{% include '_form_tokens.html' %}
    <div class="field"><label>Amount</label><input type="number" step="0.01" name="amount" value="{{ '%.2f' % (bill.balance_due_cents()/100) }}" required></div>
    <div class="field"><label>Date</label><input type="date" name="date" value="{{ today }}" required></div>
    <div class="field">
      <label>Pay from</label>
      <select name="bank_account_id" required>
        {% for b in bank_accounts %}<option value="{{ b.id }}">{{ b.name }}</option>{% endfor %}
      </select>
    </div>
    <div class="field"><label>Method</label><input name="method" placeholder="e.g. bank transfer, card, cheque"></div>
    <div class="field"><label>Reference</label><input name="reference"></div>
    <button class="btn btn-primary" type="submit">Record payment</button>
    <a href="{{ url_for('bills.detail', bill_id=bill.id) }}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
