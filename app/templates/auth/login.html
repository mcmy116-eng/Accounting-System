{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block guest_content %}
<div style="max-width:360px;margin:80px auto;">
  <div class="card">
    <h2 style="text-align:center;font-size:18px;">{{ company_settings.company_name if company_settings else "Accounting" }}</h2>
    <p class="muted" style="text-align:center;margin-top:-6px;">Sign in to continue</p>
    <form method="post">{% include '_form_tokens.html' %}
      <div class="field">
        <label>Email</label>
        <input type="email" name="email" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button class="btn btn-primary" style="width:100%;" type="submit">Log in</button>
    </form>
  </div>
</div>
{% endblock %}
