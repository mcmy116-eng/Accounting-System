{% extends "base.html" %}
{% block title %}Add bank account{% endblock %}
{% block page_title %}Add bank account{% endblock %}
{% block content %}
<div class="card" style="max-width:480px;">
  <form method="post"><label>Opening date <input type="date" name="opening_date"></label>{% include '_form_tokens.html' %}
    <div class="field"><label>Name</label><input name="name" required placeholder="e.g. HSBC Business Current Account"></div>
    <div class="field"><label>Account number (optional, last 4 digits recommended)</label><input name="account_number"></div>
    <div class="field"><label>Currency</label><input name="currency_code" value="HKD" maxlength="3"></div>
    <div class="field"><label>Opening balance</label><input type="number" step="0.01" name="opening_balance" value="0.00"></div>
    <button class="btn btn-primary" type="submit">Create</button>
    <a href="{{ url_for('bank.index') }}" class="btn">Cancel</a>
  </form>
</div>
{% endblock %}
