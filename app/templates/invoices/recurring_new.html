{% extends "base.html" %}
{% block title %}New Recurring Invoice{% endblock %}
{% block page_title %}New Recurring Invoice Schedule{% endblock %}
{% block content %}
<form method="post">{% include '_form_tokens.html' %}
  <div class="card">
    <div class="grid grid-4">
      <div class="field">
        <label>Customer</label>
        <select name="contact_id" required>{% for c in contacts %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}</select>
      </div>
      <div class="field">
        <label>Frequency</label>
        <select name="frequency">
          <option value="weekly">Weekly</option>
          <option value="monthly" selected>Monthly</option>
          <option value="quarterly">Quarterly</option>
          <option value="annual">Annual</option>
        </select>
      </div>
      <div class="field"><label>Start date</label><input type="date" name="start_date" value="{{ today }}" required></div>
      <div class="field"><label>Due in (days)</label><input type="number" name="due_days" value="14"></div>
    </div>
    <div class="field">
      <label>Cost center (segment)</label>
      <select name="cost_center_id"><option value="">— none —</option>{% for cc in cost_centers %}<option value="{{ cc.id }}">{{ cc.name }}</option>{% endfor %}</select>
    </div>
  </div>
  <div class="card">
    <h2>Line items (template)</h2>
    <table class="line-items-table" id="lines-table">
      <thead><tr><th style="width:30%;">Description</th><th>Qty</th><th>Unit price</th><th>Revenue account</th><th>Tax</th><th>Cost center</th><th></th></tr></thead>
      <tbody id="lines-body">
        <tr>
          <td><input name="line_description[]" placeholder="e.g. Monthly retainer"></td>
          <td><input name="line_quantity[]" type="number" step="any" value="1" style="width:60px;"></td>
          <td><input name="line_price[]" type="number" step="0.01" style="width:100px;"></td>
          <td><select name="line_account[]">{% for a in revenue_accounts %}<option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>{% endfor %}</select></td>
          <td><select name="line_tax[]"><option value="">— none —</option>{% for t in tax_rates %}<option value="{{ t.id }}">{{ t.name }} ({{ t.rate }}%)</option>{% endfor %}</select></td>
          <td><select name="line_cost_center[]"><option value="">—</option>{% for cc in cost_centers %}<option value="{{ cc.id }}">{{ cc.name }}</option>{% endfor %}</select></td>
          <td><button type="button" class="remove-line" onclick="this.closest('tr').remove()">&times;</button></td>
        </tr>
      </tbody>
    </table>
    <button type="button" class="btn btn-sm" id="add-line">+ Add line</button>
  </div>
  <div class="card"><div class="field"><label>Notes</label><textarea name="notes" rows="3"></textarea></div></div>
  <button class="btn btn-primary" type="submit">Create schedule</button>
  <a href="{{ url_for('invoices.recurring_index') }}" class="btn">Cancel</a>
</form>

<template id="line-template">
  <tr>
    <td><input name="line_description[]" placeholder="Description"></td>
    <td><input name="line_quantity[]" type="number" step="any" value="1" style="width:60px;"></td>
    <td><input name="line_price[]" type="number" step="0.01" style="width:100px;"></td>
    <td><select name="line_account[]">{% for a in revenue_accounts %}<option value="{{ a.id }}">{{ a.code }} - {{ a.name }}</option>{% endfor %}</select></td>
    <td><select name="line_tax[]"><option value="">— none —</option>{% for t in tax_rates %}<option value="{{ t.id }}">{{ t.name }} ({{ t.rate }}%)</option>{% endfor %}</select></td>
    <td><select name="line_cost_center[]"><option value="">—</option>{% for cc in cost_centers %}<option value="{{ cc.id }}">{{ cc.name }}</option>{% endfor %}</select></td>
    <td><button type="button" class="remove-line" onclick="this.closest('tr').remove()">&times;</button></td>
  </tr>
</template>
<script>
document.getElementById('add-line').addEventListener('click', function () {
  document.getElementById('lines-body').appendChild(document.getElementById('line-template').content.cloneNode(true));
});
</script>
{% endblock %}
